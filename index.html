<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sharon</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html,body{margin:0;min-height:100%;background:#0a0c0f;color:#f4f5f7}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    .sharon-boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#0a0c0f}
    .sharon-boot-inner{text-align:center}
    .sharon-boot-kicker{display:block;margin-bottom:5px;color:#8e959f;font-size:10px;letter-spacing:.22em}
    .sharon-boot-title{margin:0;font-size:34px;line-height:1;font-weight:700}
    .sharon-boot-status{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;color:#8e959f;font-size:12px}
    .sharon-boot-dot{width:6px;height:6px;border-radius:50%;background:#8e959f;animation:sharonBootPulse 1.2s ease-in-out infinite}
    @keyframes sharonBootPulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.sharon-boot-dot{animation:none}}
  </style>
  <link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
  <div id="app">
    <section class="sharon-boot" aria-label="Sharon start">
      <div class="sharon-boot-inner">
        <small class="sharon-boot-kicker">SHARE ON</small>
        <h1 class="sharon-boot-title">Sharon</h1>
        <div class="sharon-boot-status" aria-live="polite">
          <span class="sharon-boot-dot" aria-hidden="true"></span>
          <span>Starten</span>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
