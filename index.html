<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Sharon</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.1.4">
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#fff;color:#111}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    button,input,select,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    body{padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
    .sharon-boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;z-index:10}
    .sharon-boot-inner{width:min(320px,100%);text-align:center}
    .sharon-boot-kicker{display:block;margin-bottom:8px;color:#8b8b8f;font-size:9px;font-weight:600;letter-spacing:.24em}
    .sharon-boot-title{margin:0;font-size:34px;line-height:1;font-weight:650;letter-spacing:-.035em}
    .sharon-boot-status{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:22px;color:#9a9a9f;font-size:12px}
    .sharon-boot-dot{width:5px;height:5px;border-radius:50%;background:#9a9a9f;animation:sharonBootPulse 1.2s ease-in-out infinite}
    .sharon-intro-form{margin-top:38px;text-align:left}
    .sharon-intro-form label{display:block;margin-bottom:12px;color:#66666b;font-size:13px}
    .sharon-intro-form input{width:100%;height:48px;padding:0 2px;border:0;border-bottom:1px solid #d9d9dd;border-radius:0;background:transparent;color:#111;font-size:20px;outline:none;-webkit-appearance:none}
    .sharon-intro-form input:focus{border-bottom-color:#111}
    .sharon-intro-form button{width:100%;height:46px;margin-top:24px;border:0;background:#111;color:#fff;font-size:14px;font-weight:600}
    .sharon-intro-form button:disabled{opacity:.45}
    .shell{width:min(560px,100%);min-height:calc(100dvh - max(46px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));margin:0 auto;display:flex;flex-direction:column}
    .brand{padding:18px 2px 34px}
    .brand-line{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .brand small{display:block;margin-bottom:7px;color:#8d8d92;font-size:9px;font-weight:650;letter-spacing:.24em}
    .brand h1{margin:0;font-size:32px;line-height:1;font-weight:650;letter-spacing:-.04em}
    .brand p{margin:11px 0 0;color:#8a8a8f;font-size:14px;line-height:1.4}
    .status-dot{width:7px;height:7px;margin-top:8px;border-radius:50%;background:#d0d0d3;flex:0 0 auto;transition:background .2s ease}
    .status-dot.ok{background:#2d9a59}
    .module-list{border-top:1px solid #ececef}
    .module-row{width:100%;min-height:58px;padding:0 1px;border:0;border-bottom:1px solid #ececef;background:transparent;color:#151515;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;font-size:16px;font-weight:450;cursor:pointer}
    .module-row svg{width:17px;height:17px;fill:none;stroke:#b0b0b5;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .module-row:active{opacity:.45}
    .shell-footer{margin-top:auto;padding:32px 1px 4px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:#9a9a9f;font-size:11px}
    .location-state{min-width:0;line-height:1.35}
    .quiet-action{padding:0;border:0;background:transparent;color:#6f6f74;font-size:11px;white-space:nowrap}
    .quiet-action:disabled{opacity:.35}
    @keyframes sharonBootPulse{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sharon-boot-dot{animation:none}}
    @media (min-width:640px){body{padding-top:42px}.brand{padding-top:22px}}
  </style>
</head>
<body>
  <div id="app">
    <section class="sharon-boot" aria-label="Sharon start">
      <div class="sharon-boot-inner">
        <small class="sharon-boot-kicker">SHARE ON</small>
        <h1 class="sharon-boot-title">Sharon</h1>
        <div class="sharon-boot-status" aria-live="polite">
          <span class="sharon-boot-dot" aria-hidden="true"></span>
          <span>Starten</span>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./src/main.js?v=0.1.4"></script>
</body>
</html>
