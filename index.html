<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sharon">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sharon</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="manifest" href="./manifest.webmanifest?v=0.1.81">
  <link rel="apple-touch-icon" href="./assets/sharon-mark.png?v=0.1.81">
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#fff;color:#111}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    body{padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
    body.sharon-shell-active{padding:0;background:#f7f7f8}

    .sharon-boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;z-index:10}
    .sharon-intro-stage{width:min(390px,100%);text-align:center}
    .brand-motion{position:relative;width:100%;height:52px;margin:0 auto;color:#111}
    .brand-phrase,.brand-final{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(50px,14vw,64px);line-height:1;font-weight:300;letter-spacing:-.035em;white-space:nowrap}
    .brand-phrase{gap:.30em;opacity:1;transition:opacity .48s cubic-bezier(.22,.61,.36,1)}
    .share-word,.on-word{display:inline-flex;transition:transform .18s cubic-bezier(.33,1,.68,1)}
    .merge-e,.merge-o{display:inline-block;transform-origin:center;transition:transform .52s cubic-bezier(.22,.61,.36,1),opacity .5s ease}
    .brand-final{gap:0;align-items:baseline;opacity:0;transform:scale(.985);transition:opacity .52s cubic-bezier(.22,.61,.36,1),transform .62s cubic-bezier(.22,.61,.36,1)}
    .sharon-mark{width:.56em;height:.56em;margin:0 .018em;display:inline-flex;align-items:center;justify-content:center;transform:scale(.82) rotate(-2deg);opacity:0;transition:transform .62s cubic-bezier(.22,.61,.36,1),opacity .55s ease}
    .sharon-mark img{display:block;width:100%;height:100%;object-fit:contain}

    .brand-motion.is-anticipating .share-word{transform:translateX(-.07em)}
    .brand-motion.is-anticipating .on-word{transform:translateX(.07em)}
    .brand-motion.is-closing .share-word{transform:translateX(.25em);transition-duration:.38s;transition-timing-function:cubic-bezier(.2,.75,.2,1)}
    .brand-motion.is-closing .on-word{transform:translateX(-.25em);transition-duration:.38s;transition-timing-function:cubic-bezier(.2,.75,.2,1)}
    .brand-motion.is-closing .merge-e{transform:translateX(.09em);opacity:.64}
    .brand-motion.is-closing .merge-o{transform:translateX(-.09em);opacity:.64}
    .brand-motion.is-morphing .brand-phrase{opacity:.42}
    .brand-motion.is-morphing .merge-e,.brand-motion.is-morphing .merge-o{opacity:.18;transform:scale(.82)}
    .brand-motion.is-morphing .brand-final{opacity:.46;transform:scale(.992)}
    .brand-motion.is-morphing .sharon-mark{opacity:.42;transform:scale(.94) rotate(-1deg)}
    .brand-motion.is-marking .brand-phrase{opacity:0}
    .brand-motion.is-marking .merge-e,.brand-motion.is-marking .merge-o{opacity:0;transform:scale(.74)}
    .brand-motion.is-marking .brand-final{opacity:1;transform:scale(1)}
    .brand-motion.is-marking .sharon-mark{opacity:1;transform:scale(1) rotate(0)}
    .brand-motion.is-final .brand-final{opacity:1}

    /* Vector wordmark: all parts share one coordinate system. */
    .sharon-vector{display:block;overflow:visible}
    .vector-part{
      transform-box:view-box;
      transition:
        transform .34s cubic-bezier(.22,.61,.36,1),
        opacity .26s ease;
    }
    .vector-logo{
      opacity:0;
      transform:scale(.82);
      transform-origin:144px 55px;
    }
    .sharon-vector--sharon .vector-e,
    .sharon-vector--sharon .vector-o{opacity:0}
    .sharon-vector--sharon .vector-logo{opacity:1;transform:scale(1)}
    .sharon-vector--sharon .vector-n{transform:translateX(-40px)}

    .brand-motion{
      position:relative;
      width:min(360px,92vw);
      height:auto;
      margin:0 auto;
      color:#111;
    }
    .brand-motion.is-anticipating .vector-shar,
    .brand-motion.is-anticipating .vector-e{transform:translateX(-3px)}
    .brand-motion.is-anticipating .vector-o,
    .brand-motion.is-anticipating .vector-n{transform:translateX(3px)}
    .brand-motion.is-closing .vector-shar{transform:translateX(2px)}
    .brand-motion.is-closing .vector-e{transform:translateX(4px);opacity:.7}
    .brand-motion.is-closing .vector-o{transform:translateX(-20px);opacity:.7}
    .brand-motion.is-closing .vector-n{transform:translateX(-14px)}
    .brand-motion.is-morphing .vector-shar{transform:translateX(0)}
    .brand-motion.is-morphing .vector-e{transform:translateX(4px);opacity:.18}
    .brand-motion.is-morphing .vector-o{transform:translateX(-38px);opacity:.18}
    .brand-motion.is-morphing .vector-n{transform:translateX(-34px)}
    .brand-motion.is-morphing .vector-logo{opacity:.48;transform:scale(.92)}
    .brand-motion.is-marking .vector-e,
    .brand-motion.is-marking .vector-o,
    .brand-motion.is-final .vector-e,
    .brand-motion.is-final .vector-o{opacity:0}
    .brand-motion.is-marking .vector-n,
    .brand-motion.is-final .vector-n{transform:translateX(-40px)}
    .brand-motion.is-marking .vector-logo,
    .brand-motion.is-final .vector-logo{opacity:1;transform:scale(1)}

    .home-brand-vector{width:110px;height:auto;flex:0 0 auto}
    .home-brand-vector.is-to-logo .vector-shar,
    .home-brand-vector.is-from-logo .vector-shar{
      opacity:0;
      transform:translateX(54px);
    }
    .home-brand-vector.is-to-logo .vector-n,
    .home-brand-vector.is-from-logo .vector-n{
      opacity:0;
      transform:translateX(-88px);
    }
    .home-brand-vector.is-to-logo .vector-logo,
    .home-brand-vector.is-from-logo .vector-logo{
      opacity:1;
      transform:translateX(-64px) scale(1.45);
    }

    .sharon-logo-vector{display:block;object-fit:contain}
    .detail-home-logo{width:27px;height:27px}
    .story-brand-vector{width:102px;height:auto}

    .intro-copy{min-height:142px;margin-top:28px;opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .24s ease}
    .intro-copy.is-visible{opacity:1;transform:translateY(0)}
    .sharon-welcome{margin:18px 0 0;color:#6f6f74;font-size:15px;letter-spacing:-.01em}
    .sharon-intro-form{text-align:left}
    .sharon-intro-form label{display:block;margin-bottom:12px;color:#66666b;font-size:13px}
    .sharon-intro-form input{width:100%;height:48px;padding:0 2px;border:0;border-bottom:1px solid #d9d9dd;border-radius:0;background:transparent;color:#111;font-size:20px;outline:none;-webkit-appearance:none}
    .sharon-intro-form input:focus{border-bottom-color:#111}
    .sharon-intro-form button{width:100%;height:46px;margin-top:24px;border:0;background:#111;color:#fff;font-size:14px;font-weight:600}
    .sharon-intro-form button:disabled{opacity:.45}

    #app{position:relative;min-height:inherit}
    .app-stage{--home-swipe-x:0px;--home-swipe-progress:0;--home-swipe-radius:0px;--home-swipe-shadow:0;box-sizing:border-box;width:100%;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));position:relative;z-index:10;background:#fff;overflow:clip;border-radius:var(--home-swipe-radius) 0 0 var(--home-swipe-radius)}
    .app-stage.is-home-swiping,.app-stage.is-home-swipe-animating{transform:translate3d(var(--home-swipe-x),0,0);box-shadow:-10px 0 30px rgba(0,0,0,var(--home-swipe-shadow))}
    .app-stage.is-home-swipe-animating{transition:transform .24s cubic-bezier(.22,.61,.36,1),box-shadow .24s ease,border-radius .24s cubic-bezier(.22,.61,.36,1)}
    .app-frame{width:min(560px,100%);min-height:calc(100dvh - max(46px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));margin:0 auto;display:flex;flex-direction:column;position:relative;background:#fff}
    .app-header{min-height:92px;padding:18px 1px 34px;display:flex;align-items:center;gap:9px;position:sticky;top:max(0px,env(safe-area-inset-top));z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid transparent;backdrop-filter:blur(10px);transition:min-height .30s cubic-bezier(.22,.61,.36,1),padding .30s cubic-bezier(.22,.61,.36,1),border-color .2s ease}
    .app-header.is-detail{min-height:54px;padding:0 1px;border-bottom-color:#ececef}
    .persistent-brand-button{position:relative;width:110px;height:40px;padding:0;border:0;background:transparent;overflow:visible;flex:0 0 auto;transition:width .34s cubic-bezier(.22,.61,.36,1)}
    .app-header.is-detail .persistent-brand-button{width:30px}
    .persistent-brand-vector{position:absolute;left:0;top:50%;width:110px;height:auto;transform:translateY(-50%);overflow:visible}
    .persistent-brand-vector.is-detail .vector-shar{opacity:0;transform:translateX(54px)}
    .persistent-brand-vector.is-detail .vector-n{opacity:0;transform:translateX(-88px)}
    .persistent-brand-vector.is-detail .vector-logo{opacity:1;transform:translateX(-125px) scale(1.2)}
    .app-view-title{margin:0;max-width:0;overflow:hidden;opacity:0;transform:translateX(-5px);white-space:nowrap;color:#111;font-size:17px;line-height:1;font-weight:430;letter-spacing:-.015em;transition:max-width .32s cubic-bezier(.22,.61,.36,1),opacity .2s ease,transform .3s cubic-bezier(.22,.61,.36,1)}
    .app-header.is-detail .app-view-title{max-width:260px;opacity:1;transform:translateX(0);margin-left:0}
    .app-header .location-pulse{transition:opacity .2s ease}
    .app-header.is-detail .location-pulse{display:none;opacity:0;pointer-events:none}
    .app-view{flex:1;display:flex;flex-direction:column;min-height:0;opacity:1;transform:translateY(0);transition:opacity .16s ease,transform .16s ease}
    .app-view.is-changing{opacity:0;transform:translateY(2px)}
    .home-view{flex:1;display:flex;flex-direction:column;min-height:0}
    .module-view{width:100%}
    .shell{width:min(560px,100%);min-height:calc(100dvh - max(46px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));margin:0 auto;display:flex;flex-direction:column}
    .brand{padding:18px 1px 34px}
    .brand-line{display:flex;align-items:center;gap:9px}
    .brand-wordmark{display:inline-flex;align-items:center;gap:0;color:#111;font-size:31px;line-height:1;font-weight:300;letter-spacing:-.035em;white-space:nowrap}
    .brand-wordmark-mark{display:block;width:.56em;height:.56em;margin:0 .018em;object-fit:contain;transition:width .3s cubic-bezier(.22,.61,.36,1),height .3s cubic-bezier(.22,.61,.36,1),transform .3s cubic-bezier(.22,.61,.36,1)}
    .brand-home-prefix,.brand-home-suffix{display:inline-block;overflow:hidden;opacity:1;transform:translateX(0);transition:max-width .3s cubic-bezier(.22,.61,.36,1),opacity .2s ease,transform .3s cubic-bezier(.22,.61,.36,1)}
    .brand-home-prefix{max-width:3.2em}
    .brand-home-suffix{max-width:.7em}
    .home-brand.is-to-logo .brand-home-prefix,.home-brand.is-from-logo .brand-home-prefix{max-width:0;opacity:0;transform:translateX(.32em)}
    .home-brand.is-to-logo .brand-home-suffix,.home-brand.is-from-logo .brand-home-suffix{max-width:0;opacity:0;transform:translateX(-.18em)}
    .home-brand.is-to-logo .brand-wordmark-mark,.home-brand.is-from-logo .brand-wordmark-mark{width:.88em;height:.88em;transform:scale(1)}


    .side-menu-backdrop{position:fixed;inset:0;z-index:30;background:rgba(255,255,255,.72);backdrop-filter:blur(5px);opacity:0;transition:opacity .22s ease}
    .side-menu-backdrop.is-visible{opacity:1}
    .side-menu{position:fixed;top:0;left:0;bottom:0;z-index:31;width:min(88vw,390px);padding:max(24px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));background:#fff;border-right:1px solid #ececef;transform:translateX(-102%);transition:transform .25s cubic-bezier(.22,.61,.36,1);overflow:auto}
    .side-menu.is-visible{transform:translateX(0)}
    .side-menu-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:28px}
    .side-menu-brand{display:inline-flex;align-items:baseline;gap:0;color:#111;font-size:28px;line-height:1;font-weight:300;letter-spacing:-.035em;white-space:nowrap}
    .side-menu-brand img{display:block;width:.56em;height:.56em;margin:0 .018em;object-fit:contain}
    .side-close{width:34px;height:34px;padding:0;border:0;background:transparent;color:#8a8a8f;font-size:28px;font-weight:200;line-height:1}
    .settings-section{padding:22px 0;border-top:1px solid #ececef}
    .settings-kicker{display:block;margin-bottom:10px;color:#9a9a9f;font-size:11px}
    .settings-form{display:grid;gap:0}
    .settings-field{padding:12px 0}
    .settings-save{justify-self:start;margin-top:12px;padding:0;border:0;background:transparent;color:#444449;font-size:13px}
    .settings-row{width:100%;min-height:64px;padding:8px 0;border:0;background:transparent;color:#111;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left}
    .settings-row>span:first-child{display:grid;gap:4px}
    .settings-row strong{font-size:15px;font-weight:420}
    .settings-row small{color:#8a8a8f;font-size:12px;line-height:1.35}
    .settings-row:disabled{opacity:.55}
    .settings-arrow{color:#b0b0b5;font-size:22px;font-weight:200}
    .install-help{padding:14px 0 2px;color:#66666b;font-size:13px;line-height:1.55}
    .install-help p{margin:0 0 8px}
    .install-help ol{margin:0;padding-left:20px}
    .privacy-principles{display:grid;border-top:1px solid #ececef}
    .privacy-principle{display:grid;gap:4px;padding:13px 0;border-bottom:1px solid #ececef}
    .privacy-principle strong{font-size:14px;font-weight:420}
    .privacy-principle small{color:#7f7f84;font-size:12px;line-height:1.45}
    .privacy-note{margin:14px 0 0;color:#9a9a9f;font-size:11px;line-height:1.5}
    .location-pulse{position:relative;width:7px;height:7px;border-radius:50%;background:#c7c7cb;flex:0 0 auto;transition:background .22s ease}
    .location-pulse.is-searching::after{content:"";position:absolute;inset:-4px;border:1px solid #c7c7cb;border-radius:50%;animation:locationPulse 1.45s ease-out infinite}
    .location-pulse.is-ready{background:#2d9a59}
    .location-pulse.is-ready::after{display:none}
    .module-list{border-top:1px solid #ececef}
    .module-row{width:100%;min-height:58px;padding:0 1px;border:0;border-bottom:1px solid #ececef;background:transparent;color:#151515;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;font-size:16px;font-weight:450;cursor:pointer}
    .module-row svg{width:17px;height:17px;fill:none;stroke:#b0b0b5;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .module-row:active{opacity:.45}
    .shell-footer{margin-top:auto;padding:32px 1px 4px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:#9a9a9f;font-size:11px}
    .location-state{min-width:0;line-height:1.35}
    .quiet-action{padding:0;border:0;background:transparent;color:#6f6f74;font-size:11px;white-space:nowrap}
    .quiet-action:disabled{opacity:.35}
    .shell-footer-meta{display:grid;justify-items:end;gap:5px;flex:0 0 auto}
    .app-version{color:#c2c2c7;font-size:9px;font-weight:400;line-height:1;letter-spacing:.025em}

    .trigger-toast{margin:-12px 1px 22px;padding:11px 0;border-top:1px solid #ececef;border-bottom:1px solid #ececef;color:#333;font-size:13px;line-height:1.4;opacity:0;transform:translateY(-4px);transition:opacity .22s ease,transform .22s ease}
    .trigger-toast.is-visible{opacity:1;transform:translateY(0)}
    .persistent-toast{flex:0 0 auto}

    .detail-shell{--home-swipe-x:0px;--home-swipe-progress:0;width:min(560px,100%);min-height:calc(100dvh - max(46px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));margin:0 auto;position:relative;background:#fff}
    .detail-shell.is-home-swiping,.detail-shell.is-home-swipe-animating,.detail-shell.is-home-swipe-complete{transform:translate3d(var(--home-swipe-x),0,0);box-shadow:-14px 0 30px rgba(0,0,0,calc(.07 * var(--home-swipe-progress)))}
    .detail-shell.is-home-swipe-animating{transition:transform .24s cubic-bezier(.22,.61,.36,1),box-shadow .24s ease}
    .detail-shell.is-home-swipe-complete{transition:transform .18s ease-out}
    .detail-header{min-height:54px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #ececef;position:sticky;top:0;z-index:12;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
    .detail-header h1{margin:0;font-size:17px;line-height:1;font-weight:430;letter-spacing:-.015em}
    .home-logo-button{width:30px;height:38px;margin-left:-4px;padding:0;border:0;background:transparent;display:grid;place-items:center}
    .home-logo-button img{display:block;width:23px;height:23px;object-fit:contain}
    .home-logo-button:active{opacity:.42}
    .placeholder-copy{padding:28px 1px;color:#8a8a8f;font-size:14px;line-height:1.5}
    .placeholder-copy p{margin:0}

    .clean-list{border-top:0}
    .swipe-list{overflow:hidden}
    .swipe-row{position:relative;overflow:hidden;border-bottom:1px solid #ececef;background:#fff}
    .swipe-row .clean-row{position:relative;z-index:2;border-bottom:0;background:#fff;touch-action:pan-y;will-change:transform}
    .swipe-surface.is-animating{transition:transform .26s cubic-bezier(.22,.61,.36,1)}
    .swipe-actions{position:absolute;top:0;right:0;bottom:0;z-index:1;width:176px;display:grid;grid-template-columns:84px 92px}
    .swipe-actions button{height:100%;padding:0 8px;border:0;font-size:13px;font-weight:500;text-align:center}
    .swipe-action-edit{background:#f1f1f3;color:#333338}
    .swipe-action-delete{background:#b42318;color:#fff}
    .swipe-row.is-actions-open .swipe-actions button{font-weight:600}
    .clean-row{width:100%;min-height:64px;padding:8px 1px;border:0;border-bottom:1px solid #ececef;background:transparent;color:#151515;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left}
    .clean-row>span{min-width:0;display:grid;gap:3px}
    .clean-row strong{font-size:16px;font-weight:420}
    .clean-row small{color:#8a8a8f;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .clean-row svg{width:17px;height:17px;fill:none;stroke:#b0b0b5;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
    .empty-state{margin:28px 1px;color:#9a9a9f;font-size:14px}

    /* MapLibre draws the basemap itself; do not apply the legacy canvas transforms. */
    .environment-maplibre .environment-map{z-index:0;position:absolute;inset:0;transform:none;transform-origin:initial;transition:none;will-change:auto;background:#fff}
    .environment-maplibre .maplibregl-map{width:100%;height:100%;font-family:inherit}
    .environment-maplibre .sharon-gps-dot{width:13px;height:13px;background:#111;border:3px solid #fff;box-shadow:0 0 0 2px #111;border-radius:50%}
    .environment-maplibre .maplibregl-ctrl-bottom-right{right:max(10px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 88px)}
    .environment-maplibre .maplibregl-ctrl-attrib{font-size:9px;color:#777}
    .environment-maplibre .environment-map-error:not([hidden]){position:absolute;top:max(120px,calc(env(safe-area-inset-top) + 105px));left:50%;z-index:10;transform:translateX(-50%);max-width:86vw;background:rgba(255,255,255,.94);border:1px solid #dedee2;border-radius:12px;padding:9px 12px;font-size:11px;color:#555}
    .environment-view{width:100%;height:100%;flex:1;min-height:0;position:relative;display:flex;background:#fff}
    .environment-canvas{position:absolute;inset:0;overflow:hidden;background:#fff;touch-action:none;overscroll-behavior:none;cursor:grab}
    .environment-maplibre .environment-canvas{touch-action:auto}
    .environment-maplibre .environment-map,.environment-maplibre .maplibregl-canvas-container{touch-action:none}
    .environment-maplibre button{touch-action:manipulation;min-width:44px;min-height:44px}
    .environment-controls{position:absolute;inset:0;z-index:20;pointer-events:none}
    .environment-controls button{pointer-events:auto;touch-action:manipulation}
    .environment-controls button:disabled{opacity:.5}

    .environment-control-check{position:absolute;left:14px;right:14px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 140px);z-index:40;padding:8px;background:#fff;border:1px solid #aaa;font-size:11px;pointer-events:none}
    .environment-canvas.is-panning{cursor:grabbing}
    .environment-map{position:absolute;inset:0;transform-origin:center;transition:transform .12s ease-out;will-change:transform}
    .environment-canvas.is-pinching .environment-map,.environment-canvas.is-panning .environment-map{transition:none}

    /* Only hairline separators indicate subcategories. Swipe the uncluttered

    .environment-style-subgroup-rail{position:relative;height:54px;min-width:0}
    .environment-style-groups{
      display:grid;grid-auto-flow:column;

    .environment-style-groups::-webkit-scrollbar{display:none}
    .environment-style-group{
      position:relative;min-width:0;height:54px;overflow:hidden;scroll-snap-align:start;
      border:0;background:transparent;

    .environment-style-group:not(:last-child){border-right:1px solid rgba(70,70,80,.2)}

    }
    .environment-style-group.is-source-unavailable .environment-style-group-main{

    }
    .environment-style-group.is-height-band .environment-style-group-main span{

    }
    .environment-style-group.is-height-band.is-selected .environment-style-group-main span{
      color:#27272d;font-weight:650;
    }
    .environment-style-group-main{

      padding:3px 2px;border:0;background:none;color:#3d3d44;

    .environment-style-deviation{

    .environment-style-colors{

      align-items:stretch;gap:4px;min-width:0;

    /* At four applicable properties, show color squares instead of cramming

    .environment-style-colors.is-four-col .environment-color-edit output{

    .environment-style-colors.is-four-col .environment-color-swatch{

    }
    .environment-style-color-row{

    .environment-style-color-row>.environment-color-edit{min-width:0}
    .environment-color-edit{display:flex;align-items:center;min-width:0;gap:4px}
    .environment-color-swatch{
      position:relative;display:block;width:25px;height:24px;flex:0 0 25px;

    .environment-style-color-row .environment-hatch-current{

      width:100%;height:27px;min-height:27px!important;min-width:0!important;
      border:1px solid rgba(60,60,65,.2);border-radius:5px;

      color:#414149;touch-action:manipulation;cursor:pointer;

    .environment-hatch-current [data-hatch-current-preview]{

    }
    .environment-hatch-current svg{display:block;width:100%;height:100%}

    }
    .environment-hatch-picker{
      position:absolute;z-index:10;bottom:82px;left:0;right:0;
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));

      border:1px solid rgba(80,80,85,.22);border-radius:12px;
      background:rgba(250,250,251,.97);
      -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
      box-shadow:0 9px 24px rgba(0,0,0,.14);
      max-height:min(245px,53dvh);overflow-y:auto;overscroll-behavior:contain;
    }
    .environment-hatch-picker[hidden]{display:none!important}
    .environment-hatch-picker .environment-hatch-choice{

      gap:2px;padding:0 2px 3px;min-height:46px!important;height:46px;
      min-width:0!important;border:1px solid rgba(65,65,75,.12);border-radius:6px;
      color:#45454d;background:rgba(255,255,255,.55);touch-action:manipulation;
    }
    .environment-hatch-picker .environment-hatch-choice[aria-pressed="true"]{
      border-color:#595962;background:rgba(60,60,70,.10);
    }
    .environment-hatch-sample{display:block;height:31px;width:100%;overflow:hidden}
    .environment-hatch-sample svg{display:block;width:100%;height:100%}
    .environment-hatch-choice small{
      display:block;max-width:100%;overflow:hidden;white-space:nowrap;
      text-overflow:ellipsis;font-size:8px;line-height:10px;
    }
    .environment-color-swatch input[type=color]{
      position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;
      border:0;opacity:0;cursor:pointer;touch-action:manipulation;
    }
    .environment-color-edit output{min-width:0;font-size:9px;color:#606068;white-space:nowrap}
    .environment-style-panel button[data-inherit-field]{
      flex:0 0 24px;min-width:24px!important;width:24px;min-height:28px!important;
      height:28px;padding:0;border:0;background:none;color:#77777e;font-size:19px;
    }
    .environment-style-panel button[data-inherit-field]:disabled{
      color:#b7b7bd;opacity:.35;cursor:not-allowed;
    }
    .environment-style-panel .environment-style-color-row button[data-inherit-field]{
      position:absolute;right:0;bottom:0;min-width:18px!important;width:18px;
      min-height:27px!important;height:27px;font-size:14px;
    }
    .environment-style-color-row.is-unavailable,
    .environment-style-width.is-unavailable,
    .environment-style-dash-choices.is-unavailable,
    .environment-style-range.is-unavailable{
      opacity:.32;cursor:not-allowed;
    }
    .environment-style-color-row.is-unavailable .environment-color-swatch,
    .environment-style-dash-choices.is-unavailable button,
    .environment-style-range.is-unavailable input{
      cursor:not-allowed;
    }
    .environment-style-width{display:flex;align-items:center;gap:9px;min-height:30px}
    .environment-style-width>span{color:#63636b;font-size:11px}
    .environment-style-width>input[type=range]{
      min-width:0;flex:1;width:100%;height:26px;margin:0;
      accent-color:#65656d;touch-action:pan-x;
    }
    .environment-style-width output{min-width:24px;text-align:right;font-size:11px;color:#606068}
    .environment-style-dash-choices{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
    }
    .environment-style-dash-choices button{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:0;min-width:0!important;min-height:43px!important;height:43px;
      padding:4px 3px;border:1px solid rgba(70,70,80,.15);border-radius:7px;
      background:rgba(255,255,255,.5);color:#53535a;
    }
    .environment-style-dash-choices button[aria-pressed="true"]{
      background:rgba(70,70,80,.1);border-color:#77777f;
    }
    .environment-style-dash-choices button svg{width:85%;height:16px}
    .environment-style-dash-choices button small{font-size:9px;color:#888890;line-height:10px}
    .environment-style-range{display:grid;gap:3px;padding:0;background:none;border:0}
    .environment-style-range-head{display:flex;align-items:center;min-height:20px}
    .environment-style-range-head>span{font-size:11px;color:#67676e}
    .environment-style-range-head [data-inherit-field]{margin-left:auto}
    .environment-scale-range{position:relative;height:33px;margin:0 12px;touch-action:pan-x}
    .environment-scale-rail{
      position:absolute;top:14px;left:0;right:0;height:5px;border-radius:8px;
      background:#dddde2;pointer-events:none;
    }
    .environment-scale-rail>div{
      position:absolute;top:0;height:100%;border-radius:8px;background:#606068;
    }
    .environment-scale-range input[type=range]{
      position:absolute;top:0;left:0;width:100%;height:33px;margin:0;padding:0;
      appearance:none;-webkit-appearance:none;background:none;pointer-events:none;
    }
    .environment-scale-range input[type=range]::-webkit-slider-runnable-track{height:5px;background:transparent}
    .environment-scale-range input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:23px;height:23px;margin-top:-9px;
      border:2px solid #64646b;border-radius:50%;background:white;
      box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:auto;
    }
    .environment-scale-range input[type=range]::-moz-range-thumb{

      background:white;pointer-events:auto;
    }
    .environment-scale-range [data-scale-low]{z-index:2}
    .environment-scale-range [data-scale-high]{z-index:3}
    .environment-scale-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
    .environment-scale-labels small{
      font-size:clamp(8px,2.1vw,9px);color:#818188;text-align:center;white-space:nowrap;
    }
    @media(max-width:360px){
      .environment-style-flyout{padding:9px 7px}
      .environment-style-tabs button{padding-left:5px;padding-right:5px;font-size:10px}
      .environment-color-edit output{font-size:8px}
      .environment-style-color-row{gap:3px}
    }

    /* Keep the actual provider links centered and fully expanded, not behind
       a MapLibre info disclosure button. */
    .environment-maplibre .maplibregl-ctrl-bottom-right{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 76px);display:flex;justify-content:center;pointer-events:none}
    .environment-maplibre .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{float:none;position:relative;display:flex;align-items:center;justify-content:center;width:auto;max-width:100%;min-height:22px;margin:0;padding:2px 5px;background:rgba(255,255,255,.77);border-radius:7px;box-shadow:none;pointer-events:auto}

    .environment-maplibre .maplibregl-ctrl-attrib-inner a{color:#66666c;text-decoration:none}
    .environment-maplibre .maplibregl-ctrl-attrib-inner a:focus-visible{outline:2px solid #555;outline-offset:2px}
    /* Compact bottom stack: 68px readout, 4px gap, 18px linked attribution.
       Keep iOS's safe-area clearance; do not sacrifice the home indicator. */
    .app-stage.is-environment .environment-readout{
      bottom:max(12px,env(safe-area-inset-bottom));
    }
    .environment-maplibre .maplibregl-ctrl-bottom-right{
      left:max(14px,env(safe-area-inset-left));
      right:max(14px,env(safe-area-inset-right));
      bottom:calc(max(12px,env(safe-area-inset-bottom)) + 72px);
      display:flex;justify-content:center;pointer-events:none;
    }
    .environment-maplibre .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{
      width:auto;max-width:100%;min-height:18px;
      padding:1px 4px;pointer-events:auto;
      background:rgba(255,255,255,.74);
    }
    .environment-maplibre .maplibregl-ctrl-attrib-inner{
      text-align:center;font-size:9px;line-height:1.2;white-space:normal;
    }
    .app-stage.is-environment .environment-style-flyout{
      bottom:calc(max(12px,env(safe-area-inset-bottom)) + 103px);
    }

    /* The detail module gutters are for documents; a map occupies the
       entire desktop viewport, not the 560px reading column. */
    .app-stage.is-environment .app-view>.environment-view{
      width:100%;max-width:none;height:100%;min-height:0;
      margin:0;padding:0;overflow:hidden;
    }
    .environment-desktop-style-toggle{display:none}
    @media (min-width:900px) and (pointer:fine){
      .app-stage.is-environment .app-view>.environment-view{
        width:100%;max-width:none;min-height:0;margin:0;padding:0;
      }
      /* Hidden-in-plain-sight control: a 10px contrasting black dot with a
         40px click target and visible keyboard focus indication. */
      .app-stage.is-environment .environment-desktop-style-toggle{
        display:grid;place-items:center;
        position:absolute;left:16px;bottom:16px;z-index:25;
        width:40px;min-width:40px;height:40px;min-height:40px;
        padding:0;border:0;background:transparent;cursor:pointer;
        border-radius:50%;box-shadow:none;
        pointer-events:auto;touch-action:manipulation;
      }
      .environment-desktop-style-toggle span{
        display:block;width:10px;height:10px;border-radius:50%;
        background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.8);
        transition:box-shadow .18s ease,transform .18s ease;
      }
      .environment-desktop-style-toggle:hover span{
        transform:scale(1.2);box-shadow:0 0 0 4px rgba(17,17,17,.11);
      }
      .environment-desktop-style-toggle[aria-pressed="true"] span{
        box-shadow:0 0 0 4px rgba(17,17,17,.22),0 0 0 5px rgba(255,255,255,.9);
      }
      .environment-desktop-style-toggle:focus-visible{
        outline:2px solid #111;outline-offset:2px;
      }
      /* Reading-position rail stays near the right edge. Neither the rail nor
         style editor must cover the entire wide-screen map. */
      .app-stage.is-environment .environment-readout{
        left:auto;right:16px;bottom:16px;
        width:min(420px,calc(100vw - 88px));
      }
      .app-stage.is-environment .environment-style-flyout{
        left:16px;right:auto;bottom:65px;
        width:min(440px,calc(100vw - 32px));
        height:min(378px,calc(100dvh - 150px));
        max-height:calc(100dvh - 150px);
      }
      .environment-maplibre .maplibregl-ctrl-bottom-right{
        bottom:calc(max(18px,env(safe-area-inset-bottom)) + 82px);
      }
    }
    @media (prefers-reduced-motion:reduce){
      .brand-phrase,.brand-final,.share-word,.on-word,.merge-e,.merge-o,.sharon-mark,.intro-copy{transition-duration:.01ms!important}
      .location-pulse.is-searching::after{animation:none;opacity:.4}
      .story-layer{animation:none}
      .type-caret{animation:none;opacity:.45}
      .story-choices{transition:none}
      .trigger-toast{transition:none}
      .side-menu,.side-menu-backdrop{transition:none}
      .brand-wordmark-mark,.brand-home-prefix,.brand-home-suffix{transition:none}
      .vector-part{transition:none}
      .swipe-surface.is-animating{transition:none}
      .detail-shell.is-home-swipe-animating,.detail-shell.is-home-swipe-complete{transition:none}
      .app-stage.is-home-swipe-animating,.app-header,.persistent-brand-button,.app-view-title,.app-view{transition:none}
    }
    @media (min-width:640px){body:not(.sharon-shell-active){padding-top:42px}.sharon-shell-active .app-stage:not(.is-environment){padding-top:42px}.sharon-shell-active .app-stage.is-environment{padding-top:0}.brand{padding-top:22px}}
  </style>
</head>

  <div id="app">
    <section class="sharon-boot" data-intro aria-label="Sharon start">
