name: Sharon controles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'service-worker.js'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/sharon-checks.yml'
  pull_request:

concurrency:
  group: sharon-controles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check service-worker.js
      - name: Tests
        run: npm test
      - name: Moduleverwijzingen
        run: node scripts/check-imports.mjs
      - name: PWA-versie
        run: node scripts/check-version.mjs
