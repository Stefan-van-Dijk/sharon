name: Sharon controles

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# PRs have their own group; a new main run cancels a superseded release.
concurrency:
  group: sharon-controles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controle:
    name: Sharon releasecontrole
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Published 0.3.55 is the browser migration fixture.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - name: Appwijzigingen vereisen een hogere versie
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-version.mjs "$PR_BASE_SHA"
      - name: Bron, tests, release-assets en opstartketens
        shell: bash # Explicit bash enables pipefail, including through tee.
        run: npm run verify 2>&1 | tee verification.log
      - name: Browsers installeren
        run: npx playwright install --with-deps chromium webkit
      - name: PWA-upgrade in Chromium
        run: npm run test:pwa
      - name: Mobiele boardbediening in Chromium en WebKit
        run: npm run test:boards
      - name: Pakket na browsertests onveranderd
        run: node scripts/verify-site.mjs
      - name: Controlebewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-${{ github.sha }}
          path: |
            verification.log
            _site/release.json
            test-results/
            playwright-report/
      - name: Alleen het gecontroleerde pakket klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages publiceren
    needs: controle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Alleen de huidige hoofdbranch mag publiceren
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$CURRENT_SHA" = "$EXPECTED_SHA" || { echo 'Nieuwere hoofdbranch gevonden; publicatie geweigerd.'; exit 1; }
      # No checkout or rebuild: deploy the artifact tested by the dependency job.
      - name: Gecontroleerd artifact publiceren
        id: deployment
        uses: actions/deploy-pages@v4
