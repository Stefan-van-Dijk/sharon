name: Sharon controles

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax controleren
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check service-worker.js
      - name: Automatische tests
        run: npm test
      - name: Controle op lokale module-imports
        run: node scripts/check-imports.mjs
      - name: Controle op versie en PWA-cache
        run: node scripts/check-version.mjs
