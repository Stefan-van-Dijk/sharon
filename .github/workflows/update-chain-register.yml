name: OSM winkelregister bijwerken

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-chain-register.yml'
      - 'scripts/update-chain-register.mjs'
      - 'src/core/chains/ChainCatalog.js'
  schedule:
    - cron: '20 3 1 * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-chain-register.yml'
      - 'scripts/update-chain-register.mjs'
      - 'src/core/chains/ChainCatalog.js'

permissions:
  contents: write

concurrency:
  group: osm-chain-register-${{ github.event_name == 'pull_request' && github.ref || 'nl' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bestaande vestigingsidentiteiten behouden
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/data/osm-chains-nl; then
            git fetch origin refs/heads/data/osm-chains-nl
            git show FETCH_HEAD:register-v1.json > "$RUNNER_TEMP/register-v1.json"
            echo 'CHAIN_DATA_EXISTS=true' >> "$GITHUB_ENV"
          else
            echo 'CHAIN_DATA_EXISTS=false' >> "$GITHUB_ENV"
          fi
      - name: Nederlands OSM-bestand downloaden en controleren
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 900 -O https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          curl --fail --location --retry 3 --max-time 60 -O https://download.geofabrik.de/europe/netherlands-latest.osm.pbf.md5
          md5sum --check netherlands-latest.osm.pbf.md5
      - name: Winkelmerken lokaal uit compleet landbestand selecteren
        shell: bash
        run: |
          BRANDS=$(node --input-type=module -e "import {CHAIN_CATALOG} from './src/core/chains/ChainCatalog.js'; console.log(CHAIN_CATALOG.flatMap(c=>c.brands).join(','))")
          osmium tags-filter "$RUNNER_TEMP/netherlands-latest.osm.pbf" "nwr/brand:wikidata=$BRANDS" -o "$RUNNER_TEMP/shops.osm.pbf"
          osmium export "$RUNNER_TEMP/shops.osm.pbf" --attributes=type,id,version,timestamp -o "$RUNNER_TEMP/shops.geojson"
          SOURCE_TIMESTAMP=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$RUNNER_TEMP/netherlands-latest.osm.pbf")
          node scripts/update-chain-register.mjs "$RUNNER_TEMP/register-v1.json" "$RUNNER_TEMP/shops.geojson" "$SOURCE_TIMESTAMP"
      - name: Alleen brongegevens publiceren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "$CHAIN_DATA_EXISTS" = 'true' ]; then
            git worktree add --detach "$RUNNER_TEMP/chain-data" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/chain-data" HEAD
            git -C "$RUNNER_TEMP/chain-data" switch --orphan osm-chain-data
          fi
          cp "$RUNNER_TEMP/register-v1.json" "$RUNNER_TEMP/chain-data/register-v1.json"
          cd "$RUNNER_TEMP/chain-data"
          printf '%s\n' '# Sharon OSM winkelregister — Nederland' '' 'Bron: © OpenStreetMap contributors — https://www.openstreetmap.org/copyright' '' 'Database: Open Database License (ODbL) 1.0 — https://opendatacommons.org/licenses/odbl/1-0/' '' 'Dit register bevat uitsluitend openbare brongegevens, geen passen, GPS-metingen of persoonlijke zones.' > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add register-v1.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Werk Nederlandse winkelvestigingen bij vanuit OpenStreetMap'
            git push origin HEAD:refs/heads/data/osm-chains-nl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: osm-winkelregister-nl
          path: ${{ runner.temp }}/register-v1.json
